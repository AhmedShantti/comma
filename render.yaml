services:
  - type: web
    name: comma-pos-backend
    runtime: node
    rootDir: POS
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: API_PREFIX
        value: api/v1
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESTAURANT_NAME
        value: COMMA Café & Lounge
      - key: RESTAURANT_NAME_AR
        value: كوما كافيه ولاونج
      - key: ADDRESS
        value: Cairo, Egypt
      - key: PHONE
        value: +20123456789
      - key: VAT_RATE
        value: "15"
      - key: TIMEZONE
        value: Africa/Cairo
