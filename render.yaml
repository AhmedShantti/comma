services:
  - type: web
    name: comma-pos-backend
    runtime: node
    buildCommand: cd POS && npm install && npm run build
    startCommand: cd POS && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: comma-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESTAURANT_NAME
        value: COMMA Café & Lounge
      - key: RESTAURANT_NAME_AR
        value: كوما كافيه ولاونج
      - key: ADDRESS
        value: Cairo, Egypt
      - key: PHONE
        value: +20123456789
      - key: VAT_RATE
        value: "15"
      - key: TIMEZONE
        value: Africa/Cairo

  - type: postgresql
    name: comma-postgres
    databaseName: comma_pos
    user: postgres
    region: ohio
    plan: free
